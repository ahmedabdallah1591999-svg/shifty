<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>شيفتي - تذكير الشيفت اليومي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --teal:#0d9488; --teal-dark:#0f766e; --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 84px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header.top { background: var(--teal); color: #fff; padding: 18px 16px; border-radius: 0 0 20px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  header.top h1 { font-size: 20px; }
  header.top p { font-size: 13px; opacity: .9; margin-top: 2px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px; margin-top: 14px; box-shadow: 0 1px 4px rgba(15,23,42,.08); }
  .big-day { font-size: 15px; color: var(--muted); }
  .big-shift { font-size: 26px; font-weight: 700; margin-top: 6px; line-height: 1.5; }
  .big-shift.off { color: var(--teal-dark); }
  .big-shift.unknown { color: #b45309; font-size: 20px; }
  .tomorrow { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; background: var(--teal); color: #fff; margin-top: 12px; }
  .btn:active { background: var(--teal-dark); }
  .btn.ghost { background: #e2e8f0; color: var(--ink); }
  .btn.warn { background: #b45309; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .name-btn { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px 10px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; color: var(--ink); }
  .name-btn:active { border-color: var(--teal); }
  .weekstrip { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; }
  .daycell { min-width: 72px; flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 12px; }
  .daycell .d { color: var(--muted); font-size: 11px; }
  .daycell .s { font-weight: 700; margin-top: 4px; font-size: 12px; }
  .daycell.today { border-color: var(--teal); background: #ccfbf1; }
  .tbl-wrap { overflow-x: auto; margin-top: 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 7px 4px; text-align: center; white-space: nowrap; }
  th { background: #f8fafc; font-size: 12px; }
  td.name, th.name { position: sticky; right: 0; background: #f8fafc; font-weight: 700; min-width: 84px; }
  tr.me td { background: #ccfbf1; }
  tr.me td.name { background: #99f6e4; }
  td.today { outline: 2px solid var(--teal); outline-offset: -2px; }
  td.editable { cursor: pointer; }
  td.editable:active { background: #fef3c7; }
  nav.bottom { position: fixed; bottom: 0; right: 0; left: 0; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 20; }
  nav.bottom button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 12px; font-family: inherit; color: var(--muted); cursor: pointer; }
  nav.bottom button.on { color: var(--teal-dark); font-weight: 700; }
  nav.bottom button .ic { display: block; margin-bottom: 2px; }
  nav.bottom button .ic svg { width: 22px; height: 22px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 30; }
  .sheet { position: fixed; bottom: 0; right: 0; left: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 18px 16px 28px; z-index: 31; max-width: 560px; margin: 0 auto; }
  .sheet h3 { font-size: 16px; margin-bottom: 10px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick button { border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; font-size: 15px; font-weight: 700; font-family: inherit; background: #f8fafc; cursor: pointer; }
  .quick button:active { border-color: var(--teal); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 15px; font-family: inherit; }
  .row button { flex: none; white-space: nowrap; padding: 12px 18px; font-size: 15px; font-weight: 700; border: 0; border-radius: 12px; }
  textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 12px; font-family: monospace; direction: ltr; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.ok { background: #16a34a; } .dot.no { background: #dc2626; } .dot.mid { background: #d97706; }
  .toast { position: fixed; bottom: 90px; right: 16px; left: 16px; max-width: 520px; margin: 0 auto; background: #0f172a; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 40; text-align: center; }
  .badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 11px; border-radius: 8px; padding: 2px 8px; margin-top: 6px; }
  .emp-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .emp-row input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; }
  .emp-row button { border: 0; border-radius: 10px; padding: 10px 14px; font-family: inherit; font-weight: 700; cursor: pointer; }
  .del { background: #fee2e2; color: #b91c1c; }
  .add { background: var(--teal); color: #fff; }
  h2.sec { font-size: 15px; margin-top: 18px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottom" id="nav" style="display:none">
  <button data-tab="home" onclick="showTab('home')"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></span>شيفتي</button>
  <button data-tab="table" onclick="showTab('table')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>الجدول</button>
  <button data-tab="settings" onclick="showTab('settings')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span>الإعدادات</button>
</nav>
<script src="app.js"></script>
</body>
</html>
